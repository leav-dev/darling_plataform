[package]
name = "dp-cli"
description = "Command-line interface for inspecting and administering Darling Platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "dp"
path = "src/main.rs"

[dependencies]
dp-app-installer = { path = "../../modules/application-management/app-installer" }
dp-app-library = { path = "../../modules/application-management/app-library" }
dp-bundle-inspector = { path = "../../modules/application-management/bundle-inspector" }
dp-compatibility-engine = { path = "../../modules/compatibility-engine" }
dp-hardware-intelligence = { path = "../../modules/hardware-intelligence" }
dp-shared-prefix = { path = "../../modules/shared-prefix" }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
