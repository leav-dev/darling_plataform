[package]
name = "dp-compatibility-engine"
description = "Static and dynamic analysis of macOS application requirements against known runtime capabilities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
dp-bundle-inspector = { path = "../application-management/bundle-inspector" }
serde = { version = "1.0.229", features = ["derive"] }
# The capability profile is TOML and it is validated, not guessed: a parser is
# cheaper to trust than a hand-rolled scanner once entries grow a `note`.
toml = "0.8.23"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
